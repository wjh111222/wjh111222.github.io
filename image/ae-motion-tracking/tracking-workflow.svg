<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">从素材到信息标签的跟踪工作流</title>
  <desc id="desc">素材提供运动，跟踪器生成数据，空对象接收数据，信息标签作为子级跟随空对象。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#818cf8"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="600" y="70" text-anchor="middle" fill="#f8fafc" font-size="35" font-weight="700">把分析数据和图形设计分开管理</text>
    <text x="600" y="109" text-anchor="middle" fill="#94a3b8" font-size="19">素材 → 跟踪数据 → 空对象 → 信息标签</text>
    <g filter="url(#shadow)">
      <rect x="55" y="195" width="240" height="270" rx="24" fill="#0c4a6e"/>
      <circle cx="175" cy="264" r="38" fill="#38bdf8"/><path d="M153 264h44M175 242v44" stroke="#fff" stroke-width="6"/>
      <text x="175" y="345" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">1. 素材</text>
      <text x="175" y="385" text-anchor="middle" fill="#bae6fd" font-size="18">选择稳定真实特征</text>
      <text x="175" y="417" text-anchor="middle" fill="#bae6fd" font-size="18">PRODUCT_FOOTAGE</text>
      <rect x="335" y="195" width="240" height="270" rx="24" fill="#4c1d95"/>
      <rect x="425" y="231" width="60" height="60" fill="none" stroke="#c4b5fd" stroke-width="5"/><rect x="405" y="211" width="100" height="100" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="8 6"/>
      <text x="455" y="345" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">2. 分析</text>
      <text x="455" y="385" text-anchor="middle" fill="#ddd6fe" font-size="18">生成位置关键帧</text>
      <text x="455" y="417" text-anchor="middle" fill="#ddd6fe" font-size="18">Tracker 1</text>
      <rect x="615" y="195" width="240" height="270" rx="24" fill="#713f12"/>
      <rect x="696" y="224" width="78" height="78" fill="none" stroke="#fbbf24" stroke-width="5"/><path d="M735 213v100M685 263h100" stroke="#fde68a" stroke-width="3"/>
      <text x="735" y="345" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">3. 接收</text>
      <text x="735" y="385" text-anchor="middle" fill="#fde68a" font-size="18">应用 X / Y 数据</text>
      <text x="735" y="417" text-anchor="middle" fill="#fde68a" font-size="18">TRACK_NULL</text>
      <rect x="895" y="195" width="250" height="270" rx="24" fill="#115e59"/>
      <rect x="937" y="225" width="166" height="70" rx="12" fill="#ecfeff"/><text x="1020" y="268" text-anchor="middle" fill="#134e4a" font-size="20" font-weight="700">产品信息</text><path d="M937 302L910 330" stroke="#5eead4" stroke-width="5"/><circle cx="910" cy="330" r="8" fill="#5eead4"/>
      <text x="1020" y="365" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">4. 跟随</text>
      <text x="1020" y="405" text-anchor="middle" fill="#ccfbf1" font-size="18">Parent 到空对象</text>
      <text x="1020" y="437" text-anchor="middle" fill="#ccfbf1" font-size="18">LABEL_PRECOMP</text>
    </g>
    <g stroke="#818cf8" stroke-width="5" marker-end="url(#arrow)"><path d="M302 330h22"/><path d="M582 330h22"/><path d="M862 330h22"/></g>
    <rect x="173" y="545" width="854" height="65" rx="20" fill="#1e293b" stroke="#475569"/>
    <text x="600" y="585" text-anchor="middle" fill="#e2e8f0" font-size="20">换文字不必重新跟踪；修跟踪也不必拆散整组图形</text>
  </g>
</svg>
