<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AE 跟踪点的三个组成部分</title>
  <desc id="desc">内层特征区域识别图案，外层搜索区域限定下一帧搜索范围，附着点指定跟踪结果应用的位置。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#25213f"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="600" y="67" text-anchor="middle" fill="#f8fafc" font-size="35" font-weight="700">一个跟踪点，包含三种不同职责</text>
    <text x="600" y="106" text-anchor="middle" fill="#94a3b8" font-size="19">认什么 · 去哪找 · 把结果放在哪里</text>
    <rect x="390" y="165" width="420" height="360" rx="24" fill="#111827" stroke="#475569" stroke-width="3"/>
    <path d="M390 390L505 302L604 378L704 270L810 350V525H390Z" fill="#164e63"/>
    <circle cx="604" cy="320" r="39" fill="#f59e0b"/>
    <rect x="456" y="217" width="235" height="205" fill="none" stroke="#60a5fa" stroke-width="5" stroke-dasharray="12 8"/>
    <rect x="548" y="271" width="112" height="98" fill="none" stroke="#f8fafc" stroke-width="5"/>
    <path d="M660 320h97M708.5 271v98" stroke="#f472b6" stroke-width="5"/>
    <circle cx="708.5" cy="320" r="9" fill="#f472b6"/>
    <path d="M454 222C336 222 318 242 270 270" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M548 370C400 474 321 457 270 424" fill="none" stroke="#f8fafc" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M757 320C886 320 911 288 948 246" fill="none" stroke="#f472b6" stroke-width="3" marker-end="url(#arrow)"/>
    <g font-size="22">
      <text x="72" y="274" fill="#93c5fd" font-weight="700">Search Region</text>
      <text x="72" y="309" fill="#cbd5e1" font-size="17">下一帧去哪里找</text>
      <text x="72" y="429" fill="#f8fafc" font-weight="700">Feature Region</text>
      <text x="72" y="464" fill="#cbd5e1" font-size="17">要识别哪个图案</text>
      <text x="948" y="245" fill="#f9a8d4" font-weight="700">Attach Point</text>
      <text x="948" y="280" fill="#cbd5e1" font-size="17">目标最终跟随的位置</text>
    </g>
    <rect x="190" y="574" width="820" height="56" rx="28" fill="#1e293b" stroke="#475569"/>
    <text x="600" y="610" text-anchor="middle" fill="#e2e8f0" font-size="20">内框尽量紧，外框覆盖帧间位移，附着点可以保留设计偏移</text>
  </g>
</svg>
