<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">蒙太奇意义生成公式</title><desc id="desc">镜头A与镜头B组合后产生新的观众理解C。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#312e81"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter></defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="600" y="67" text-anchor="middle" fill="#fff" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="36" font-weight="700">蒙太奇：意义产生在两个镜头之间</text>
  <text x="600" y="108" text-anchor="middle" fill="#c4b5fd" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19">镜头 A + 镜头 B，不只是相加，而是引导观众得出新的理解 C</text>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" filter="url(#sh)">
    <g transform="translate(70 175)"><rect width="300" height="330" rx="24" fill="#eff6ff"/><rect x="25" y="25" width="250" height="175" rx="12" fill="#334155"/><circle cx="150" cy="100" r="52" fill="#f2c6a0"/><path d="M97 85q53-75 106 0v-43H97z" fill="#1e293b"/><path d="M125 103h15m20 0h15" stroke="#334155" stroke-width="6" stroke-linecap="round"/><path d="M138 135q12 5 24 0" fill="none" stroke="#7c2d12" stroke-width="5"/><text x="150" y="244" text-anchor="middle" fill="#1e3a8a" font-size="27" font-weight="700">镜头 A：人物</text><text x="150" y="282" text-anchor="middle" fill="#475569" font-size="18">平静、没有明确表情</text><text x="150" y="315" text-anchor="middle" fill="#64748b" font-size="16">单独看，意义不完整</text></g>
    <text x="415" y="350" fill="#93c5fd" font-size="62" font-weight="700">+</text>
    <g transform="translate(470 175)"><rect width="300" height="330" rx="24" fill="#fff7ed"/><rect x="25" y="25" width="250" height="175" rx="12" fill="#fed7aa"/><ellipse cx="150" cy="145" rx="88" ry="24" fill="#fff"/><circle cx="150" cy="120" r="55" fill="#fb923c"/><path d="M117 105q33-30 66 0M125 125h50" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><text x="150" y="244" text-anchor="middle" fill="#7c2d12" font-size="27" font-weight="700">镜头 B：食物</text><text x="150" y="282" text-anchor="middle" fill="#9a3412" font-size="18">一碗刚端上的热汤</text><text x="150" y="315" text-anchor="middle" fill="#c2410c" font-size="16">提供新的情境信息</text></g>
    <text x="815" y="350" fill="#93c5fd" font-size="62" font-weight="700">=</text>
    <g transform="translate(870 175)"><rect width="260" height="330" rx="24" fill="#f0fdf4"/><circle cx="130" cy="100" r="62" fill="#22c55e"/><path d="M100 102h60M130 72v60" stroke="#fff" stroke-width="9" stroke-linecap="round"/><text x="130" y="215" text-anchor="middle" fill="#14532d" font-size="27" font-weight="700">理解 C</text><text x="130" y="256" text-anchor="middle" fill="#166534" font-size="20" font-weight="700">“他饿了”</text><text x="130" y="294" text-anchor="middle" fill="#475569" font-size="17">饥饿并不在任一镜头里</text><text x="130" y="320" text-anchor="middle" fill="#64748b" font-size="16">而由观众主动建立</text></g>
  </g>
  <rect x="185" y="555" width="830" height="72" rx="36" fill="#fff" opacity=".1"/>
  <text x="600" y="585" text-anchor="middle" fill="#f8fafc" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="700">把镜头 B 换成棺材、孩子或空房间，人物表情的含义也会改变</text>
  <text x="600" y="613" text-anchor="middle" fill="#c4b5fd" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17">剪辑不是解释全部，而是为观众安排联想的方向</text>
</svg>
