<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">四种常用蒙太奇结构</title><desc id="desc">展示平行、交叉、对比和重复蒙太奇的时间线结构。</desc>
  <defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient></defs>
  <rect width="1200" height="675" fill="url(#b)"/>
  <text x="600" y="64" text-anchor="middle" fill="#0f172a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="36" font-weight="700">四种蒙太奇：结构不同，观众的理解方式不同</text>
  <text x="600" y="103" text-anchor="middle" fill="#64748b" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19">先确定叙事任务，再选择排列方式</text>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <g transform="translate(65 145)"><rect width="510" height="210" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="32" y="45" fill="#1e3a8a" font-size="25" font-weight="700">① 平行蒙太奇</text><text x="32" y="76" fill="#475569" font-size="17">两条独立线索并行发展，不一定立即相遇</text><text x="32" y="124" fill="#2563eb" font-size="17" font-weight="700">A</text><rect x="65" y="102" width="105" height="34" rx="7" fill="#2563eb"/><rect x="185" y="102" width="105" height="34" rx="7" fill="#3b82f6"/><rect x="305" y="102" width="105" height="34" rx="7" fill="#60a5fa"/><text x="32" y="174" fill="#ea580c" font-size="17" font-weight="700">B</text><rect x="65" y="152" width="105" height="34" rx="7" fill="#ea580c"/><rect x="185" y="152" width="105" height="34" rx="7" fill="#f97316"/><rect x="305" y="152" width="105" height="34" rx="7" fill="#fb923c"/></g>
    <g transform="translate(625 145)"><rect width="510" height="210" rx="24" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="32" y="45" fill="#14532d" font-size="25" font-weight="700">② 交叉蒙太奇</text><text x="32" y="76" fill="#475569" font-size="17">两条线索交替出现，并向同一时刻汇合</text><text x="32" y="124" fill="#2563eb" font-size="17" font-weight="700">A</text><rect x="65" y="102" width="72" height="34" rx="7" fill="#2563eb"/><rect x="225" y="102" width="58" height="34" rx="7" fill="#3b82f6"/><rect x="355" y="102" width="42" height="34" rx="7" fill="#60a5fa"/><text x="32" y="174" fill="#ea580c" font-size="17" font-weight="700">B</text><rect x="145" y="152" width="72" height="34" rx="7" fill="#ea580c"/><rect x="291" y="152" width="56" height="34" rx="7" fill="#f97316"/><rect x="405" y="152" width="42" height="34" rx="7" fill="#fb923c"/><circle cx="465" cy="144" r="24" fill="#22c55e"/><text x="465" y="151" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">汇合</text></g>
    <g transform="translate(65 395)"><rect width="510" height="210" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="32" y="45" fill="#7c2d12" font-size="25" font-weight="700">③ 对比蒙太奇</text><text x="32" y="76" fill="#475569" font-size="17">把相反画面并置，强化差异或讽刺</text><rect x="45" y="103" width="180" height="76" rx="12" fill="#fde68a"/><circle cx="105" cy="141" r="26" fill="#f59e0b"/><text x="165" y="148" text-anchor="middle" fill="#92400e" font-size="18" font-weight="700">盛宴</text><text x="255" y="151" text-anchor="middle" fill="#9a3412" font-size="36" font-weight="700">VS</text><rect x="285" y="103" width="180" height="76" rx="12" fill="#cbd5e1"/><circle cx="345" cy="141" r="26" fill="#64748b"/><text x="405" y="148" text-anchor="middle" fill="#334155" font-size="18" font-weight="700">空碗</text></g>
    <g transform="translate(625 395)"><rect width="510" height="210" rx="24" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/><text x="32" y="45" fill="#581c87" font-size="25" font-weight="700">④ 重复蒙太奇</text><text x="32" y="76" fill="#475569" font-size="17">同一画面或动作再次出现，含义随情境变化</text><g transform="translate(45 103)"><rect width="100" height="76" rx="10" fill="#a855f7"/><path d="M28 38h44" stroke="#fff" stroke-width="7"/><rect x="135" width="100" height="76" rx="10" fill="#7e22ce"/><path d="M163 38h44" stroke="#fff" stroke-width="7"/><rect x="270" width="100" height="76" rx="10" fill="#581c87"/><path d="M298 38h44" stroke="#fff" stroke-width="7"/></g><text x="440" y="151" text-anchor="middle" fill="#7e22ce" font-size="17" font-weight="700">意义加深</text></g>
  </g>
  <text x="600" y="646" text-anchor="middle" fill="#475569" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18">蒙太奇类型可以组合使用，但每一次排列都应承担明确的叙事任务</text>
</svg>
