<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="hue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ef4444"/><stop offset=".17" stop-color="#f59e0b"/><stop offset=".34" stop-color="#eab308"/><stop offset=".51" stop-color="#22c55e"/><stop offset=".68" stop-color="#06b6d4"/><stop offset=".84" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="sat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="600" y="70" text-anchor="middle" fill="#f8fafc" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700">色彩的三个基本维度</text>
  <text x="600" y="108" text-anchor="middle" fill="#94a3b8" font-family="Microsoft YaHei, sans-serif" font-size="19">先描述颜色，再讨论它如何服务叙事</text>
  <g font-family="Microsoft YaHei, sans-serif">
    <text x="120" y="190" fill="#f8fafc" font-size="25" font-weight="700">色相 Hue</text>
    <text x="120" y="220" fill="#94a3b8" font-size="17">它是什么颜色，决定画面的基本倾向</text>
    <rect x="390" y="165" width="690" height="66" rx="16" fill="url(#hue)"/>
    <text x="120" y="340" fill="#f8fafc" font-size="25" font-weight="700">明度 Value</text>
    <text x="120" y="370" fill="#94a3b8" font-size="17">它有多亮，决定视觉重量与可见程度</text>
    <rect x="390" y="315" width="690" height="66" rx="16" fill="url(#light)" stroke="#64748b"/>
    <text x="120" y="490" fill="#f8fafc" font-size="25" font-weight="700">饱和度 Saturation</text>
    <text x="120" y="520" fill="#94a3b8" font-size="17">它有多鲜艳，决定刺激强度与情绪距离</text>
    <rect x="390" y="465" width="690" height="66" rx="16" fill="url(#sat)"/>
    <rect x="230" y="590" width="740" height="54" rx="16" fill="#fff" fill-opacity=".07" stroke="#475569"/>
    <text x="600" y="625" text-anchor="middle" fill="#e2e8f0" font-size="19">同一色相改变明度和饱和度，也会产生完全不同的气质</text>
  </g>
</svg>
