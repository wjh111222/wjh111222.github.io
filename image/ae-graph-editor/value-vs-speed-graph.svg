<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AE 数值图与速度图的区别</title>
  <desc id="desc">左侧数值图显示属性值随时间变化，右侧速度图显示变化速率随时间变化。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#211d46"/></linearGradient>
    <linearGradient id="valueFill" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#38bdf8" stop-opacity=".05"/><stop offset="1" stop-color="#38bdf8" stop-opacity=".28"/></linearGradient>
    <linearGradient id="speedFill" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#f472b6" stop-opacity=".05"/><stop offset="1" stop-color="#f472b6" stop-opacity=".32"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".24"/></filter>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="600" y="66" text-anchor="middle" fill="#f8fafc" font-size="35" font-weight="700">同一段动画，两种不同读法</text>
    <text x="600" y="105" text-anchor="middle" fill="#94a3b8" font-size="19">横轴都是时间，纵轴决定你正在观察什么</text>

    <g filter="url(#shadow)">
      <rect x="60" y="150" width="510" height="390" rx="24" fill="#111827" stroke="#334155"/>
      <rect x="630" y="150" width="510" height="390" rx="24" fill="#111827" stroke="#334155"/>
    </g>

    <text x="315" y="198" text-anchor="middle" fill="#7dd3fc" font-size="26" font-weight="700">Value Graph · 数值图</text>
    <text x="885" y="198" text-anchor="middle" fill="#f9a8d4" font-size="26" font-weight="700">Speed Graph · 速度图</text>

    <g stroke="#334155" stroke-width="1">
      <path d="M128 254H526M128 329H526M128 404H526M128 479H526"/>
      <path d="M198 230V479M298 230V479M398 230V479M498 230V479"/>
      <path d="M698 254H1096M698 329H1096M698 404H1096M698 479H1096"/>
      <path d="M768 230V479M868 230V479M968 230V479M1068 230V479"/>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="2"><path d="M128 230V479H526"/><path d="M698 230V479H1096"/></g>

    <path d="M145 462C196 462 214 456 243 423C301 356 327 281 377 254C420 231 457 235 510 235L510 479H145Z" fill="url(#valueFill)"/>
    <path d="M145 462C196 462 214 456 243 423C301 356 327 281 377 254C420 231 457 235 510 235" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="145" cy="462" r="8" fill="#e0f2fe"/><circle cx="510" cy="235" r="8" fill="#e0f2fe"/>
    <path d="M715 468C738 465 750 389 782 306C815 220 858 219 895 248C943 285 973 409 1080 468L1080 479H715Z" fill="url(#speedFill)"/>
    <path d="M715 468C738 465 750 389 782 306C815 220 858 219 895 248C943 285 973 409 1080 468" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="715" cy="468" r="8" fill="#fce7f3"/><circle cx="1080" cy="468" r="8" fill="#fce7f3"/>

    <g fill="#cbd5e1" font-size="17">
      <text x="327" y="515" text-anchor="middle">时间 →</text>
      <text x="897" y="515" text-anchor="middle">时间 →</text>
      <text x="105" y="355" text-anchor="middle" transform="rotate(-90 105 355)">属性值</text>
      <text x="675" y="355" text-anchor="middle" transform="rotate(-90 675 355)">变化速度</text>
    </g>
    <g font-size="16">
      <text x="162" y="446" fill="#bae6fd">起始值</text><text x="434" y="225" fill="#bae6fd">最终值</text>
      <text x="838" y="224" fill="#fbcfe8" font-weight="700">峰值 = 最快</text><text x="1010" y="456" fill="#fbcfe8">回到 0 = 停稳</text>
    </g>

    <rect x="180" y="574" width="840" height="58" rx="29" fill="#1e293b" stroke="#475569"/>
    <text x="600" y="611" text-anchor="middle" fill="#e2e8f0" font-size="20">数值图看“到了哪里”　·　速度图看“怎样抵达”</text>
  </g>
</svg>

