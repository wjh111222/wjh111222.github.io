<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg2)"/>
  <text x="600" y="70" text-anchor="middle" fill="#f8fafc" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700">J Cut 与 L Cut：让声音跨过画面切点</text>
  <text x="600" y="108" text-anchor="middle" fill="#94a3b8" font-family="Microsoft YaHei, sans-serif" font-size="19">画面在切，听觉可以提前进入，也可以继续停留</text>

  <g font-family="Microsoft YaHei, sans-serif">
    <text x="80" y="175" fill="#f8fafc" font-size="26" font-weight="700">J Cut</text>
    <text x="80" y="206" fill="#94a3b8" font-size="17">下一场声音先出现，画面随后抵达</text>
    <rect x="250" y="150" width="410" height="74" rx="12" fill="#2563eb"/>
    <rect x="660" y="150" width="460" height="74" rx="12" fill="#7c3aed"/>
    <text x="455" y="196" text-anchor="middle" fill="#fff" font-size="21">画面 A：办公室</text>
    <text x="890" y="196" text-anchor="middle" fill="#fff" font-size="21">画面 B：火车站</text>
    <line x1="660" y1="136" x2="660" y2="314" stroke="#f8fafc" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="660" y="130" text-anchor="middle" fill="#f8fafc" font-size="16">画面切点</text>
    <rect x="485" y="248" width="635" height="58" rx="10" fill="#0ea5e9"/>
    <text x="802" y="285" text-anchor="middle" fill="#fff" font-size="19">火车广播声提前进入 → 引导观众进入下一空间</text>

    <text x="80" y="390" fill="#f8fafc" font-size="26" font-weight="700">L Cut</text>
    <text x="80" y="421" fill="#94a3b8" font-size="17">上一场声音继续，画面已经离开</text>
    <rect x="250" y="365" width="410" height="74" rx="12" fill="#db2777"/>
    <rect x="660" y="365" width="460" height="74" rx="12" fill="#ea580c"/>
    <text x="455" y="411" text-anchor="middle" fill="#fff" font-size="21">画面 A：争吵现场</text>
    <text x="890" y="411" text-anchor="middle" fill="#fff" font-size="21">画面 B：独自回家</text>
    <line x1="660" y1="351" x2="660" y2="529" stroke="#f8fafc" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="660" y="345" text-anchor="middle" fill="#f8fafc" font-size="16">画面切点</text>
    <rect x="250" y="463" width="635" height="58" rx="10" fill="#f43f5e"/>
    <text x="568" y="500" text-anchor="middle" fill="#fff" font-size="19">争吵声延续 → 情绪留在人物心里</text>
  </g>

  <rect x="245" y="575" width="710" height="66" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#475569"/>
  <text x="600" y="616" text-anchor="middle" fill="#e2e8f0" font-family="Microsoft YaHei, sans-serif" font-size="20">核心：声音切点与画面切点不必发生在同一帧</text>
</svg>
