<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <radialGradient id="room" cx="50%" cy="48%" r="68%">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#room)"/>
  <text x="600" y="68" text-anchor="middle" fill="#f8fafc" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700">客观声音与主观声音</text>
  <text x="600" y="106" text-anchor="middle" fill="#94a3b8" font-family="Microsoft YaHei, sans-serif" font-size="19">改变观众“听见谁的世界”，就能改变叙事视角</text>

  <line x1="600" y1="140" x2="600" y2="602" stroke="#475569" stroke-width="2"/>

  <g font-family="Microsoft YaHei, sans-serif">
    <text x="300" y="176" text-anchor="middle" fill="#38bdf8" font-size="26" font-weight="700">客观听觉</text>
    <circle cx="300" cy="335" r="112" fill="#0284c7" fill-opacity=".18" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="300" cy="305" r="34" fill="#e2e8f0"/>
    <path d="M225 438c10-70 42-105 75-105s65 35 75 105" fill="#e2e8f0"/>
    <path d="M145 255q35-28 70 0M385 255q35-28 70 0M135 375q40 28 80 0M385 375q40 28 80 0" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <text x="300" y="493" text-anchor="middle" fill="#e2e8f0" font-size="19">环境、人声、音乐保持自然比例</text>
    <text x="300" y="525" text-anchor="middle" fill="#94a3b8" font-size="17">观众像站在现场观察人物</text>

    <text x="900" y="176" text-anchor="middle" fill="#f472b6" font-size="26" font-weight="700">主观听觉</text>
    <circle cx="900" cy="335" r="112" fill="#db2777" fill-opacity=".18" stroke="#f472b6" stroke-width="3" filter="url(#glow)"/>
    <circle cx="900" cy="305" r="34" fill="#e2e8f0"/>
    <path d="M825 438c10-70 42-105 75-105s65 35 75 105" fill="#e2e8f0"/>
    <path d="M845 285q-35 50 0 100M955 285q35 50 0 100" fill="none" stroke="#f472b6" stroke-width="7" stroke-linecap="round"/>
    <circle cx="900" cy="305" r="70" fill="none" stroke="#f9a8d4" stroke-width="3" stroke-dasharray="5 10"/>
    <text x="900" y="493" text-anchor="middle" fill="#e2e8f0" font-size="19">耳鸣、心跳或某个细节被异常放大</text>
    <text x="900" y="525" text-anchor="middle" fill="#94a3b8" font-size="17">观众被拉进人物的身体与意识</text>
  </g>

  <rect x="210" y="574" width="780" height="62" rx="18" fill="#fff" fill-opacity=".07" stroke="#64748b"/>
  <text x="600" y="614" text-anchor="middle" fill="#f8fafc" font-family="Microsoft YaHei, sans-serif" font-size="20">声音透视不是“大小声”，而是叙事视角的选择</text>
</svg>
