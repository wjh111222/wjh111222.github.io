<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">遮罩转场的图层关系</title>
  <desc id="desc">遮罩图层向画面B提供透明度，画面B显示真正内容，未显示区域露出下方画面A。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#262343"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="600" y="67" text-anchor="middle" fill="#f8fafc" font-size="35" font-weight="700">谁提供画面，谁控制可见区域？</text>
    <text x="600" y="106" text-anchor="middle" fill="#94a3b8" font-size="19">轨道遮罩与被遮罩素材是两个独立职责</text>
    <g transform="translate(70 175)">
      <rect width="310" height="92" rx="18" fill="#7c3aed"/>
      <text x="28" y="40" fill="#fff" font-size="25" font-weight="700">MATTE_WIPE</text>
      <text x="28" y="70" fill="#ede9fe" font-size="17">提供 Alpha · 决定哪里可见</text>
      <rect y="122" width="310" height="92" rx="18" fill="#0369a1"/>
      <text x="28" y="162" fill="#fff" font-size="25" font-weight="700">SHOT_B</text>
      <text x="28" y="192" fill="#e0f2fe" font-size="17">新镜头 · 提供真正画面内容</text>
      <rect y="244" width="310" height="92" rx="18" fill="#334155"/>
      <text x="28" y="284" fill="#fff" font-size="25" font-weight="700">SHOT_A</text>
      <text x="28" y="314" fill="#cbd5e1" font-size="17">旧镜头 · 从透明区域露出</text>
    </g>
    <path d="M397 221C465 221 458 337 520 337" fill="none" stroke="#a78bfa" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="460" y="262" text-anchor="middle" fill="#c4b5fd" font-size="17">Alpha Matte</text>
    <g transform="translate(520 175)">
      <rect width="610" height="336" rx="24" fill="#07111f" stroke="#475569"/>
      <clipPath id="half"><rect width="305" height="336"/></clipPath>
      <rect width="610" height="336" rx="24" fill="#1e3a5f"/>
      <circle cx="440" cy="113" r="74" fill="#f59e0b" opacity=".8"/>
      <path d="M0 282L160 180L290 250L445 146L610 272V336H0Z" fill="#0f766e"/>
      <g clip-path="url(#half)">
        <rect width="610" height="336" fill="#562e72"/>
        <circle cx="130" cy="114" r="65" fill="#a78bfa"/>
        <path d="M0 278L125 195L260 260L398 165L610 290V336H0Z" fill="#7c3aed"/>
      </g>
      <path d="M305 0v336" stroke="#f8fafc" stroke-width="5"/>
      <text x="152" y="309" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">B 已揭示</text>
      <text x="457" y="309" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">A 仍可见</text>
    </g>
    <rect x="210" y="570" width="780" height="56" rx="28" fill="#1e293b" stroke="#475569"/>
    <text x="600" y="606" text-anchor="middle" fill="#e2e8f0" font-size="20">移动遮罩边界，改变 B 的可见范围；透明区域自然露出 A</text>
  </g>
</svg>
