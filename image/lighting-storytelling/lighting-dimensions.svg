<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">光线叙事的四个维度</title>
  <desc id="desc">方向、软硬、明暗和色温共同影响观众对人物与空间的理解。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#312e4d"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="60" r="190" fill="#f59e0b" opacity=".08"/>
  <circle cx="100" cy="650" r="230" fill="#3b82f6" opacity=".08"/>
  <text x="600" y="72" text-anchor="middle" fill="#f8fafc" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="36" font-weight="700">光线如何参与叙事</text>
  <text x="600" y="112" text-anchor="middle" fill="#a7b4c8" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19">四个维度共同决定人物被看见的方式</text>

  <g filter="url(#shadow)" font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <rect x="60" y="180" width="250" height="330" rx="26" fill="#eff6ff"/>
    <circle cx="185" cy="252" r="44" fill="#3b82f6"/>
    <path d="M145 252h76M205 237l20 15-20 15" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="185" y="345" text-anchor="middle" fill="#1e3a8a" font-size="29" font-weight="700">方向</text>
    <text x="185" y="389" text-anchor="middle" fill="#1e40af" font-size="18">光从哪里来？</text>
    <text x="185" y="425" text-anchor="middle" fill="#1e40af" font-size="18">正面、侧面或背后</text>
    <text x="185" y="461" text-anchor="middle" fill="#1e40af" font-size="18">塑造人物关系与空间</text>

    <rect x="337" y="180" width="250" height="330" rx="26" fill="#f5f3ff"/>
    <circle cx="462" cy="252" r="44" fill="#8b5cf6"/>
    <circle cx="447" cy="252" r="17" fill="#fff" opacity=".95"/>
    <circle cx="479" cy="252" r="8" fill="#fff" opacity=".5"/>
    <text x="462" y="345" text-anchor="middle" fill="#4c1d95" font-size="29" font-weight="700">软硬</text>
    <text x="462" y="389" text-anchor="middle" fill="#5b21b6" font-size="18">阴影如何过渡？</text>
    <text x="462" y="425" text-anchor="middle" fill="#5b21b6" font-size="18">柔和、包容或锐利</text>
    <text x="462" y="461" text-anchor="middle" fill="#5b21b6" font-size="18">改变画面的情绪触感</text>

    <rect x="613" y="180" width="250" height="330" rx="26" fill="#f8fafc"/>
    <circle cx="738" cy="252" r="44" fill="#475569"/>
    <path d="M738 213a39 39 0 0 1 0 78z" fill="#fff"/>
    <text x="738" y="345" text-anchor="middle" fill="#1e293b" font-size="29" font-weight="700">明暗</text>
    <text x="738" y="389" text-anchor="middle" fill="#334155" font-size="18">哪里亮，哪里隐藏？</text>
    <text x="738" y="425" text-anchor="middle" fill="#334155" font-size="18">控制反差与视觉重点</text>
    <text x="738" y="461" text-anchor="middle" fill="#334155" font-size="18">安排观众的观看顺序</text>

    <rect x="890" y="180" width="250" height="330" rx="26" fill="#fff7ed"/>
    <circle cx="1015" cy="252" r="44" fill="url(#warm)"/>
    <path d="M990 252h50" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <text x="1015" y="345" text-anchor="middle" fill="#7c2d12" font-size="29" font-weight="700">色温</text>
    <text x="1015" y="389" text-anchor="middle" fill="#9a3412" font-size="18">空间偏冷还是偏暖？</text>
    <text x="1015" y="425" text-anchor="middle" fill="#9a3412" font-size="18">建立时间、情绪与记忆</text>
    <text x="1015" y="461" text-anchor="middle" fill="#9a3412" font-size="18">也可以分隔人物关系</text>
  </g>

  <rect x="205" y="558" width="790" height="62" rx="31" fill="#0f172a" stroke="#64748b"/>
  <text x="600" y="598" text-anchor="middle" fill="#e2e8f0" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="700">布光不是增加灯具，而是为每个维度做出清晰选择</text>
</svg>
