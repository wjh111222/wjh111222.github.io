<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">从目标客户到行动的转化叙事路径</title>
  <desc id="desc">目标客户、清晰解释、价值兑现、前后转变、信任复盘、证据与行动构成转化叙事流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#2e1b45"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#a78bfa"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="600" y="67" text-anchor="middle" fill="#f8fafc" font-size="35" font-weight="700">六种方法，共同完成一条信任路径</text>
    <text x="600" y="106" text-anchor="middle" fill="#a5b4fc" font-size="19">先让对的人认出自己，再让下一步有理由发生</text>

    <g filter="url(#shadow)">
      <rect x="55" y="180" width="330" height="135" rx="22" fill="#0c4a6e"/>
      <rect x="435" y="180" width="330" height="135" rx="22" fill="#4c1d95"/>
      <rect x="815" y="180" width="330" height="135" rx="22" fill="#7c2d12"/>
      <rect x="55" y="365" width="330" height="135" rx="22" fill="#164e63"/>
      <rect x="435" y="365" width="330" height="135" rx="22" fill="#3730a3"/>
      <rect x="815" y="365" width="330" height="135" rx="22" fill="#115e59"/>
    </g>

    <g fill="#fff" font-size="24" font-weight="700">
      <text x="88" y="224">01　目标客户</text><text x="468" y="224">02　清晰解释</text><text x="848" y="224">03　价值兑现</text>
      <text x="88" y="409">04　前后转变</text><text x="468" y="409">05　信任复盘</text><text x="848" y="409">06　匹配证据</text>
    </g>
    <g fill="#dbeafe" font-size="17">
      <text x="88" y="260">Avatar Framing</text><text x="88" y="288">让相关的人认出自己</text>
      <text x="468" y="260" fill="#ede9fe">Broad to Narrow</text><text x="468" y="288" fill="#ede9fe">从情境走向具体动作</text>
      <text x="848" y="260" fill="#ffedd5">Double Aha</text><text x="848" y="288" fill="#ffedd5">先提供收获，再给入口</text>
      <text x="88" y="445" fill="#cffafe">Transformation</text><text x="88" y="473" fill="#cffafe">看见从 A 到 B 的变化</text>
      <text x="468" y="445" fill="#e0e7ff">Double Zoom Out</text><text x="468" y="473" fill="#e0e7ff">找出信任发生在哪一刻</text>
      <text x="848" y="445" fill="#ccfbf1">Buyer Psychology</text><text x="848" y="473" fill="#ccfbf1">证据支持主张与行动</text>
    </g>

    <g fill="none" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrow)">
      <path d="M385 247h38"/><path d="M765 247h38"/><path d="M980 315v38"/><path d="M815 433h-38"/><path d="M435 433h-38"/>
    </g>
    <rect x="185" y="558" width="830" height="62" rx="31" fill="#1e293b" stroke="#475569"/>
    <text x="600" y="597" text-anchor="middle" fill="#e2e8f0" font-size="20">相关性 → 理解 → 收获 → 期待 → 复盘 → 信任与行动</text>
  </g>
</svg>

